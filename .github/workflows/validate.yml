name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate kit
        shell: pwsh
        run: .\scripts\validate-kit.ps1

      - name: Test install script
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP "test-install"
          # Remove previous test dir if exists
          if (Test-Path $target) { Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue }
          & pwsh -ExecutionPolicy Bypass -File ".\scripts\install-claude-kit.ps1" -Target $target -Profile core
          $required = @("CLAUDE.md", "AGENTS.md", ".claude-kit-version")
          $missing = @()
          foreach ($item in $required) {
            $path = Join-Path $target $item
            if (-not (Test-Path -LiteralPath $path)) {
              $missing += $item
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Install test failed — missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Install script verified successfully. All required files present in $target"

      - name: Test remote install script
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP "test-remote-install"
          if (Test-Path $target) { Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue }
          # Test remote script locally (it won't download since kit is already checked out)
          & pwsh -ExecutionPolicy Bypass -File ".\scripts\install-claude-kit.ps1" -Target $target -Profile unity -Force
          # Verify Unity-specific skill exists
          $unitySkill = Join-Path $target ".claude\skills\unity6-project"
          if (Test-Path $unitySkill) {
            Write-Host "Remote install unity profile test PASSED"
          } else {
            Write-Host "::error::Unity profile test failed — unity6-project skill missing"
            exit 1
          }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
